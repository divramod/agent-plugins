# The tollman's role folder (roles/tollman/ of the field tollman-<repo>), every file by its kind
# (hal2's .adr/role-folder-formats.md): `hal2-cli-roles check <folder> --manifest <this file>`. The train state is
# written by scripts/train_state.py, the message board by scripts/board.py; the other files are the round frame's
# (the farmer skill's scripts): its log.jsonl lines are legacy ones (no `schema`, local time without an offset),
# declared as the record allows for legacy files (rule 3): they pass counted, are never rewritten and leave by
# rotation and retention.
schema = 1
role = "tollman"

[[files]]
path = "train.jsonl"
kind = "event-log"
schema = "schemas/train.schema.json"
description = "The train state: one line per change of a wagon train (scripts/train_state.py)."

[[files]]
path = "board.jsonl"
kind = "event-log"
schema = "schemas/board.schema.json"
description = "The message board: one line per ready ticket, train, landing, message, ack and note for the farmer (scripts/board.py), the farm view's feed. Append-only, one write per line; pruned only by whole lines from its start when it passes 2 MB (down to 1 MB, by rename under board.lock), so a follower that finds the file smaller starts again at its first line."

[[files]]
path = "checks.jsonl"
kind = "event-log"
schema = "schemas/checks.schema.json"
description = "The held-back check runs (hal2 plan 0306, the duty `checks`: scripts/checks.py): one line per deferral, dispatch, cancel and supersede. ci-check's `checks defer` and `checks dispatched` append to it, the duty's `checks cancel` and `checks dispatch` too; one write per line under O_APPEND."

[[files]]
path = "train-landing.log"
kind = "text-log"
description = "The output of the train's landing (hal2-cli-git worktree merge-to-main --json), rewritten by every start."

[[files]]
path = "train-pretest.log"
kind = "text-log"
description = "The output of the train's pretest (scripts/pretest_train.py, plan 0349 D75), each job's line then its output, rewritten by every pretest."

[[files]]
path = "cache/**"
kind = "cache"
description = "The pretest's green markers, `cache/pretest/gate-<job>-<key>` (empty files, scripts/pretest.py), under CACHEDIR.TAG: may be deleted at any time, a marker older than 14 days goes at every pretest."

[[files]]
path = "log.jsonl"
kind = "event-log"
description = "The frame's round log (the farmer skill's scripts): legacy lines without schema, at in local time."

[[files]]
path = "runs.jsonl"
kind = "keyed-log"
key = "name"

[[files]]
path = "mode"
kind = "scalar"
values = ["claude", "timer"]

[[files]]
path = "silent"
kind = "scalar"
values = ["on"]
description = "Present while the rounds are silenced (`tollman.py silence`, farmer/scripts/silence.py): a round prints one table line per train with a joined column."

[[files]]
path = "*.lock"
kind = "lock"
description = "tick.lock (the round) and board.lock (the board's writers), held with flock; disk.lock, the one `prune.py sizes` run (its pid, taken over after 30 minutes; plan 0360 step 7)."

[[files]]
path = "tick.log*"
kind = "text-log"

[[files]]
path = "*.json"
kind = "snapshot"
description = "The frame's snapshots: wake.json (what the tick handed to the session), timer.json, last-scan.json, priority.json, paused.json; learn.json, the duty learn's last day (scripts/learn.py); disk.json, the duty prune's free disk and biggest worktrees (scripts/prune.py sizes, plan 0360 step 7); mode.json, the queue's mode the last round saw (scripts/modes.py, plan 0360 step 25)."

[[files]]
path = "summaries/**"
kind = "record"
type = "Round Summary"

[[files]]
path = "handoff.md"
kind = "record"
type = "Role Handoff"

[[files]]
path = "flaky.md"
kind = "record"
type = "Ledger"

[[files]]
path = "learnings.md"
kind = "record"
type = "Ledger"
description = "The learnings: one entry per red train, error or by-hand fix (scripts/learnings.py), read first by `/tollman act`; a hand-written file without the envelope is legacy and passes."

[[files]]
path = "stats.md"
kind = "record"
type = "Ledger"
description = "The duty learn's daily before/after verdict per learning and the day's summary metrics (scripts/verdicts.py), rewritten by every run."

[[files]]
path = "briefs/*.md"
kind = "record"
type = "Brief"
description = "The duty learn's daily brief of the untaken learnings for one foreman (scripts/learn.py), placed through the farmer's delegation ledger."
