# /smuggle's settings for @REPO@ (/smuggle configure, @DATE@); KEY=value, never sourced.
# GitHub: the land workflows (file names under .github/workflows; merge-to-main-local.yml, merge-to-main-cloud.yml,
# dev-merge-to-main.yml and merge-to-main.yml are one workflow before and after its renames: ci-stop.sh asks all where one is listed); GitLab: the land
# refs (globs).
LAND_WORKFLOWS=@LAND_WORKFLOWS@
LAND_REFS="land/*"
# The job whose success means the default branch moved; after it a run is waited for.
MERGE_JOB=merge
# How long a merged run's jobs that never started may wait for a runner before they are cancelled.
SHIP_GRACE=15m
# The inputs configure read; when they change, `smuggle.sh preflight` says the scripts are stale.
FINGERPRINT_INPUTS="@FINGERPRINT_INPUTS@"
FINGERPRINT=@FINGERPRINT@
