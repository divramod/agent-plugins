# /mtm-fastlane's settings for @REPO@ (/mtm-fastlane configure, @DATE@); KEY=value, never sourced.
# GitHub: the land workflows (files under .github/workflows); GitLab: the land refs (globs).
LAND_WORKFLOWS=@LAND_WORKFLOWS@
LAND_REFS="land/*"
# The job whose success means the default branch moved; after it a run is waited for.
MERGE_JOB=merge
# How long a merged run's jobs that never started may wait for a runner before they are cancelled.
SHIP_GRACE=15m
# The inputs configure read; when they change, `fastlane.sh preflight` says the scripts are stale.
FINGERPRINT_INPUTS="@FINGERPRINT_INPUTS@"
FINGERPRINT=@FINGERPRINT@
