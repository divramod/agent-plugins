# The farmer's role folder (roles/farmer/ of the field farmer-<repo>), every file of the round frame by its kind
# (hal2's .adr/role-folder-formats.md): `hal2-cli-roles check <folder> --manifest <this file>`. The message board is
# written by scripts/board.py (plan 0290 D23: the same script and form as the tollman's, `--role farmer`); the other
# files are the frame's (this skill's scripts): the log.jsonl lines are legacy ones (no `schema`, local time without an
# offset; new lines carry `at` in UTC with Z since hal2 plan 0530), declared as the record allows for legacy files
# (rule 3): they pass counted, are never rewritten and leave by rotation and retention. One-off notes the user or the
# farmer leave in the folder are findings, as the record says.
schema = 1
role = "farmer"

[[files]]
path = "board.jsonl"
kind = "event-log"
schema = "schemas/board.schema.json"
description = "The message board: one line per instruction the farmer sent (an `ask-ack` of its journal), ack it got and note (scripts/board.py sync, run by every tick), the farm view's feed. Append-only, one write per line; pruned only by whole lines from its start when it passes 2 MB (down to 1 MB, by rename under board.lock), so a follower that finds the file smaller starts again at its first line."

[[files]]
path = "log.jsonl"
kind = "event-log"
description = "The frame's round log, the farmer's journal (this skill's scripts): lines without schema; `at` in RFC 3339 UTC with Z since hal2 plan 0530 (roletime.py), older lines legacy local time without an offset, read as local. Read by scripts/board.py alone; hal2 never parses it."

[[files]]
path = "runs.jsonl"
kind = "keyed-log"
key = "name"

[[files]]
path = "mode"
kind = "scalar"
values = ["claude", "timer"]

[[files]]
path = "silent"
kind = "scalar"
values = ["on"]
description = "Present while the rounds are silenced (`farmer.py silence`, scripts/silence.py): a round prints one table line."

[[files]]
path = "board.lock.*"
kind = "foreign"
description = "A board writer's announced take of board.lock, `board.lock.<pid>` (a farm lock's intent, hal2 plan 0561 D16): written before the take, removed after the release; a dead pid's is removed by the workqueue's sweep."

[[files]]
path = "*.lock"
kind = "lock"
description = "tick.lock (the round) and board.lock (the board's writers take turns on it), held with flock; empty, or while held one farm-lock record {schema, pid, taken} naming the holder (hal2 plan 0561): a freeze spares that process until the lock is released."

[[files]]
path = "tick.log*"
kind = "text-log"

[[files]]
path = "tick-health.json"
kind = "snapshot"
schema = "schemas/tick-health.schema.json"
description = "The failing streak of the farmer's timer rounds (hal2 plan 0530 D4; the farmer skill's scripts/tick_health.py, from role_cli.run_tick): `{schema, at, failures, error, notified}`, rewritten by every round outside a dry run; the 2nd failed round in a row sends one desktop notice and a line at the top of summaries/latest.md, a good round resets it."

[[files]]
path = "*.json"
kind = "snapshot"
description = "The frame's snapshots: wake.json (what the tick handed to the session), timer.json, last-scan.json, priority.json, disk.json, queue-watch.json (the queue duty's findings with their first-seen and alarmed times, `{schema 1, at, findings}`, replaced each real round: scripts/queue_watch.py)."

[[files]]
path = "tasks/*.json"
kind = "snapshot"
description = "A detached task's result, one file per task, overwritten by its next run (retention: count 1), written atomically by the run's own process (scripts/task_detach.py, plan 0534): `{schema 1, task, state starting|running|done, pid, started, ended, limit, cmds, exit, output, consumed}`; the next tick evaluates a done one once."

[[files]]
path = "summaries/**"
kind = "record"
type = "Round Summary"

[[files]]
path = "handoff.md"
kind = "record"
type = "Role Handoff"

[[files]]
path = "flaky.md"
kind = "record"
type = "Ledger"

[[files]]
path = "briefs/*.md"
kind = "record"
type = "Brief"
description = "A delegated task's brief (scripts/delegation.py), placed through the delegation ledger."

[[files]]
path = "servants/*.md"
kind = "record"
type = "Assignment"

[[files]]
path = "pending/*.patch"
kind = "foreign"

[[files]]
path = "ci.jsonl"
kind = "event-log"
description = "The ci duty's runs seen (scripts/ci_scan.py record): legacy lines."

[[files]]
path = "lead.jsonl"
kind = "event-log"
description = "The lead duty's session notes (scripts/lead_scan.py record): legacy lines."

[[files]]
path = "delegations.jsonl"
kind = "keyed-log"
key = "key"
description = "The delegation ledger (scripts/delegation.py): the last line per key is the delegation's state."

[[files]]
path = "questions.jsonl"
kind = "keyed-log"
key = "n"
description = "The farmer's own question store (scripts/questions.py): the last line per question number is its state."
